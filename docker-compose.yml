services:
  postgres:
    image: postgres:16-alpine
    container_name: bazzaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazzaro
      POSTGRES_PASSWORD: bazzaro
      POSTGRES_DB: bazzaro
    ports:
      - "5432:5432"
    volumes:
      - bazzaro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazzaro -d bazzaro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bazzaro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - bazzaro-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bazzaro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bazzaro
      MINIO_ROOT_PASSWORD: bazzaro-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bazzaro-media:/data

volumes:
  bazzaro-postgres:
  bazzaro-redis:
  bazzaro-media:
